[project]
name = "opsflow-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "streamlit>=1.40,<2",
  "httpx>=0.27,<1",
  "requests>=2.32,<3",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

# Streamlit Cloud uses Poetry to install dependencies. This repository is an
# application, and the dashboard is launched directly from frontend/dashboard.py.
# Keep Poetry in dependency-management mode rather than trying to package the
# project as a distribution named "opsflow-ai".
[tool.poetry]
package-mode = false

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["frontend*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
